name: Cashfree CI

on:
  push:
    branches:
      - main
      - cashfree-sbd-integration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cashfree-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile > /tmp/install.log 2>&1 || {
            cat /tmp/install.log
            exit 1
          }

      - name: Generate routes and build
        shell: bash
        run: |
          bun run build > /tmp/build.log 2>&1 || {
            cat /tmp/build.log
            exit 1
          }

      - name: Format integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/cashfree-sbd-integration'
        run: bun run format

      - name: Commit generated routes and formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/cashfree-sbd-integration'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Format Cashfree integration and regenerate routes"
          git push origin HEAD:cashfree-sbd-integration

      - name: Check formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/cashfree-sbd-integration'
        run: bun run format:check

      - name: TypeScript check
        run: bun run typecheck

      - name: Generate lint report
        id: lint
        continue-on-error: true
        run: bunx eslint . --format json --output-file lint-report.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: |
          echo "ESLint failed. Download the lint-report artifact for exact findings."
          exit 1
